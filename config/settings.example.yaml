# Example configuration for ai-news-platform.
# Domains and sources are declarative: add new domains/sources without changing code.

app:
  service_name: "ai-news-platform"

logging:
  format: "json"
  level: "INFO"

storage:
  database_path_env: "DATABASE_PATH"

ingestion:
  max_article_age_hours: 24

publishing:
  max_articles_per_run: 1
  interval_seconds: 180
  default_publisher: "telegram"
  telegram:
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    parse_mode: "HTML"
    disable_web_page_preview: false
llm:
  enabled: true
  prompts_dir: "prompts"
  default_target_language: "ru"
  max_articles_per_run: 100
  batch_size: 10
  reasoning_effort: minimal
  pricing:
    models:
      gpt-5.2:
        input_price_per_million_usd: 1.75
        output_price_per_million_usd: 14.00
      gpt-5.4-mini:
        input_price_per_million_usd: 0.75
        output_price_per_million_usd: 4.50
      gpt-5-mini:
        input_price_per_million_usd: 0.25
        output_price_per_million_usd: 2.00
  # LLM provider/model integration intentionally deferred.

domains:
  - id: "football"
    name: "Football"
    telegram:
      channel_id: "-1003961481668"
    llm:
      enabled: true
      target_language: "ru"
      pipeline_prompt: "football_pipeline.txt"
    sources:
      - id: "bbc_sport_football"
        type: "rss"
        name: "BBC Sport Football"
        url: "https://feeds.bbci.co.uk/sport/football/rss.xml"
        config:
          timeout_seconds: 60
          retry_attempts: 3
      # - id: "espn_soccer"
      #   type: "rss"
      #   name: "ESPN Soccer"
      #   url: "https://www.espn.com/espn/rss/soccer/news"
      #   config:
      #     timeout_seconds: 60
      #     retry_attempts: 3
      # Временно отключено: ESPN стабильно отвечает HTTP 202 + пустой body из-за AWS WAF challenge.
      - id: "sky_sports_football"
        type: "rss"
        name: "Sky Sports Football"
        url: "https://www.skysports.com/rss/12040"
        config:
          timeout_seconds: 60
          retry_attempts: 3
      - id: "bbc_champions_league"
        type: "rss"
        name: "BBC Champions League"
        url: "https://feeds.bbci.co.uk/sport/football/champions-league/rss.xml"
        config:
          timeout_seconds: 60
          retry_attempts: 3
      - id: "marca_laliga"
        type: "rss"
        name: "MARCA La Liga"
        url: "https://e00-marca.uecdn.es/rss/futbol/primera-division.xml"
        config:
          timeout_seconds: 60
          retry_attempts: 3

  - id: "ai"
    name: "AI"
    telegram:
      channel_id: "-1004483465338"
    llm:
      enabled: true
      target_language: "ru"
      pipeline_prompt: "ai_pipeline.txt"
    sources:
      - id: "openai_blog"
        type: "rss"
        name: "OpenAI Blog"
        url: "https://openai.com/blog/rss.xml"
        config:
          # Минимальные опции для больших RSS-лент (AI-домен):
          # - не старше 30 дней
          # - сортировка по убыванию даты
          # - брать только top 50
          # - записи без даты отбрасывать
          rss_max_age_hours: 720
          rss_sort_by_published_desc: true
          rss_max_items: 50
          rss_drop_if_no_date: true
          timeout_seconds: 60
          retry_attempts: 3

      # - id: "anthropic_news"
      #   type: "rss"
      #   name: "Anthropic News"
      #   url: "https://www.anthropic.com/news/rss.xml"
      #   config:
      #     rss_max_age_hours: 720
      #     rss_sort_by_published_desc: true
      #     rss_max_items: 50
      #     rss_drop_if_no_date: true
      #
      # В текущем виде URL возвращает 404 Not Found, поэтому источник временно отключён.

      - id: "venturebeat_ai"
        type: "rss"
        name: "VentureBeat AI"
        url: "https://venturebeat.com/category/ai/feed/"
        config:
          rss_max_age_hours: 1440
          rss_sort_by_published_desc: true
          rss_max_items: 50
          # У VentureBeat периодически встречаются записи без даты или отдаётся нестандартный ответ,
          # поэтому не отбрасываем entry без даты (иначе часто получаем 0 items).
          rss_drop_if_no_date: false
          # Browser-like UA: помогает избежать пустых/заглушечных ответов.
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          timeout_seconds: 60
          retry_attempts: 3

      - id: "hn_ai"
        type: "rss"
        name: "Hacker News AI"
        url: "https://hnrss.org/newest?q=AI"
        config:
          rss_max_age_hours: 720
          rss_sort_by_published_desc: true
          rss_max_items: 50
          rss_drop_if_no_date: true
          timeout_seconds: 60
          retry_attempts: 3
